spack:
  # `spack env create <name> <this file>` turns this path, relative to the directory of
  # this file, into an absolute one (only for the named form, not for a list entry).
  repos:
    hpxfft: ../spack_repo/hpxfft
  specs:
  - hpxfft.hpx@2.0.0 cxxstd=20 malloc=system networking=all max_cpu_count=256 instrumentation=none %gcc@14.2.0
  - fftw@3.3.10 +mpi +openmp %gcc@14.2.0
  - openmpi@5.0.5
  view: true
  concretizer:
    unify: true
