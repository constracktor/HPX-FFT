spack:
  # `spack env create <name> <this file>` turns this path, relative to the directory of
  # this file, into an absolute one (only for the named form, not for a list entry).
  repos:
    hpxfft: ../spack_repo/hpxfft
  specs:
  - hpxfft.hpx@2.0.0 cxxstd=20 malloc=system networking=all max_cpu_count=256 instrumentation=none %gcc@14.2.0
  - fftw@3.3.10 +mpi +openmp %gcc@14.2.0
  - openmpi@5.0.5
  # p3dfft_mpi_omp needs the ProcGrid/DataGrid API, which is not in the 3.0.0 release; the samples use implicit int and mismatched Fortran arguments, which GCC 14 rejects by default
  - p3dfft3@develop +fftw +mpi cflags="-Wno-error=implicit-int -Wno-error=implicit-function-declaration" fflags="-fallow-argument-mismatch" %gcc@14.2.0
  view: true
  concretizer:
    unify: true
